name: Lint

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Lint
      uses: avto-dev/markdown-lint@v1
      with:
        args: .
